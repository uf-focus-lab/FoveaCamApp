; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:teensy40]
platform = teensy
framework = arduino
board = teensy40
; Uploads run through the system's native teensy_loader_cli (Homebrew:
; `brew install teensy_loader_cli`) — no loader GUI, no Rosetta: the
; PlatformIO tool-teensy package ships the GUI as a universal binary from
; 1.162.0 but its bundled CLI is still x86_64-only. -s soft-reboots a running
; USB-serial Teensy, -w waits for the bootloader otherwise.
platform_packages = platformio/tool-teensy@^1.162.0
upload_protocol = custom
upload_command = teensy_loader_cli --mcu=TEENSY40 -s -w -v $SOURCE
lib_deps = 
	file://../lib
